services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?Set DASHBOARD_TOKEN in .env}
      DATA_BACKEND: ${DATA_BACKEND:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-personal-images}
    volumes:
      - dashboard-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4173) + '/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  dashboard-data:
